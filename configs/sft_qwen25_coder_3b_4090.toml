[sft]
model_id = "Qwen/Qwen2.5-Coder-3B-Instruct"
model_revision = "488639f1ff808d1d3d0ba301aef8c11461451ec5"
train_file = "artifacts/datasets/sft/train.jsonl"
eval_file = "artifacts/datasets/sft/validation.jsonl"
output_dir = "outputs/sft-qwen25-coder-3b-4090"
max_length = 4096
epochs = 2.0
learning_rate = 2e-4
per_device_batch_size = 1
gradient_accumulation_steps = 16
warmup_ratio = 0.03
weight_decay = 0.0
logging_steps = 5
save_steps = 100
save_total_limit = 2
eval_steps = 100
seed = 42
load_in_4bit = true
bf16 = true
gradient_checkpointing = true

[sft.lora]
rank = 32
alpha = 64
dropout = 0.05
target_modules = [
  "q_proj",
  "k_proj",
  "v_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
]
