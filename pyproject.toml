[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reporl"
version = "0.1.0"
description = "Executable-reward post-training for repository-level coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Dong Zhao" }]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
sandbox = [
  "docker>=7.1,<8",
  "unidiff>=0.7,<1",
]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
training = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]

[project.scripts]
reporl-collect = "reporl.rollouts.collector:main"
reporl-evaluate = "reporl.evaluation.report:main"
reporl-grpo = "reporl.training.grpo:main"
reporl-policy-server = "reporl.agent.policy_server:main"
reporl-preflight = "reporl.cloud.preflight:main"
reporl-prepare-sft = "reporl.training.prepare_sft:main"
reporl-prepare-swe-smith = "reporl.tasks.swe_smith_prepare:main"
reporl-sft = "reporl.training.sft:main"
reporl-materialize = "reporl.tasks.materialize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reporl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reporl"]
